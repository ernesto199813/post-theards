name: Post diario en Threads

on:
  schedule:
    # Cada 30 minutos: GitHub retrasa horas o se salta a veces los cron, así que no se confía en
    # una ejecución por horario. bot/schedule.py decide si toca publicar (horarios en HORARIOS:
    # 8:47 a. m., 1:17 p. m. y 7:47 p. m. de Venezuela) y, si no, el job termina en segundos.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar el post, sin publicar"
        type: boolean
        default: true
      force_refresh:
        description: "Forzar renovación del token de Threads"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar data/history.json

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 y podría romper Chromium
    timeout-minutes: 15   # Threads tarda unos minutos en procesar los videos
    steps:
      - uses: actions/checkout@v5

      # Las ejecuciones manuales publican siempre; las programadas solo si toca un horario.
      - name: ¿Toca publicar?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python3 bot/schedule.py
          fi

      - uses: actions/setup-python@v6
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y Chromium
        if: steps.due.outputs.due == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generar y publicar
        if: steps.due.outputs.due == 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COTIZADOS_API_URL: ${{ vars.COTIZADOS_API_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh || 'false' }}
        run: python bot/post.py

      - name: Guardar token renovado
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f "$RUNNER_TEMP/new_token" ]; then
            echo "No hubo renovación de token en esta ejecución."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secreto GH_PAT: el token renovado no se pudo guardar."
            exit 0
          fi
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token"
          rm -f "$RUNNER_TEMP/new_token"
          echo "Secreto THREADS_ACCESS_TOKEN actualizado."

      - name: Guardar historial
        if: steps.due.outputs.due == 'true'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "cotizados-bot"
            git config user.email "cotizados-bot@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: post diario $(date -u +%F)"
            git push
          fi
