name: Post diario en Threads

on:
  schedule:
    # Horas en UTC; Venezuela es UTC-4. Para publicar más o menos veces, agrega o quita líneas.
    - cron: "47 12 * * *"   # 8:47 a. m.
    - cron: "17 17 * * *"   # 1:17 p. m.
    - cron: "47 23 * * *"   # 7:47 p. m.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar el post, sin publicar"
        type: boolean
        default: true
      force_refresh:
        description: "Forzar renovación del token de Threads"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar data/history.json

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 y podría romper Chromium
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generar y publicar
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COTIZADOS_API_URL: ${{ vars.COTIZADOS_API_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh || 'false' }}
        run: python bot/post.py

      - name: Guardar token renovado
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f "$RUNNER_TEMP/new_token" ]; then
            echo "No hubo renovación de token en esta ejecución."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secreto GH_PAT: el token renovado no se pudo guardar."
            exit 0
          fi
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token"
          rm -f "$RUNNER_TEMP/new_token"
          echo "Secreto THREADS_ACCESS_TOKEN actualizado."

      - name: Guardar historial
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "cotizados-bot"
            git config user.email "cotizados-bot@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: post diario $(date -u +%F)"
            git push
          fi
